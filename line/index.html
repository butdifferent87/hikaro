<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE — Hikaro</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://hikaro-world.com/">
<!--
  LINE 친구추가 경유지. 들른 흔적(유입구)을 GA4 에 남기고 LINE 으로 넘긴다.

  왜 line.me 로 바로 보내지 않는가:
    ManyChat DM 버튼이 line.me 로 직행하면 "인스타 DM 에서 LINE 으로 넘어갔다"가
    어디에도 안 남는다(ManyChat 은 클릭 수만, LINE 은 친구 수만 안다).
    여기를 한 번 거치게 해서 GA4 에 click_line_gate{entry, where:'redirect'} 를 찍는다.
    이벤트명은 홈페이지 LINE 버튼(index.html, where=onyomi_section/final_cta)과 같다 —
    "LINE 게이트 클릭 총합"을 한 숫자로 보고, entry·where 로 가른다.

  🔴 유입구는 ?s= 로 받는다 (/pdf 계열과 같은 ENTRY 표). 예: /line?s=dm
     자료별 구분은 ManyChat 자동화별 클릭 수로 본다 — 여기서 쿼리를 늘리지 않는다.
-->
<style>
  body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:14px;background:#FAFAF8;color:#1A1A1A;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  a{display:block;padding:16px 28px;border-radius:14px;background:#06C755;color:#fff;font-weight:700;text-decoration:none}
  p{font-size:13px;color:#5C7066}
</style>
<p>LINEを開いています…</p>
<a id="go" href="https://line.me/R/ti/p/@318wqtvv">LINEで友だち追加</a>
<p>自動で開かない場合は、上のボタンを押してください。</p>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-XBCFC6FWB6"></script>
<script>
  // /pdf 계열과 같은 표. 새 이름을 지으면 GA4 에서 같은 채널이 두 종류로 갈린다.
  var ENTRY = {
    line:  ['line', 'official_account'],
    bc:    ['line', 'broadcast'],
    story: ['instagram', 'story'],
    bio:   ['instagram', 'bio'],
    feed:  ['instagram', 'feed'],
    dm:    ['instagram', 'dm'],
    note:  ['note', 'article'],
    yt:    ['youtube', 'video'],
    th:    ['threads', 'post'],
    threads: ['threads', 'post']
  };
  var code = new URLSearchParams(location.search).get('s');
  var hit = Object.prototype.hasOwnProperty.call(ENTRY, code) ? ENTRY[code] : null;

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XBCFC6FWB6', hit ? {
    campaign_source: hit[0], campaign_medium: hit[1], campaign_name: 'line_add'
  } : {});

  var url = document.getElementById('go').href;
  var went = false;
  function go() { if (!went) { went = true; location.replace(url); } }
  gtag('event', 'click_line_gate', {
    entry: hit ? code : 'unknown', where: 'redirect', transport_type: 'beacon', event_callback: go
  });
  setTimeout(go, 700);   // GA4 가 막혀도(광고차단 등) LINE 은 반드시 연다
</script>
</html>
