<!--

  왜 /pdf 를 재사용하지 않고 한 칸 더 파는가:
    한 주소가 두 파일을 조건으로 갈라 주면, GA4 에서 "몇 명이 무엇을 받았나"가
    한 이벤트에 섞인다. asset 파라미터로 나눌 수는 있지만, 그러려면 링크마다
    쿼리를 두 개(?s= 와 ?a=) 붙여야 하고 사람이 손으로 조합하다 틀린다.
    자산이 늘 때마다 칸을 하나 파는 편이, 링크가 짧고 통계가 안 섞인다.

  🔴 유입구는 주소의 ?s= 로 받는다 (/pdf 와 동일 규칙, 같은 ENTRY 표).
     2탄의 주 유입구는 LINE 이라 line 코드를 추가했다.
     쓰는 법: hikaro-world.com/pdf2?s=line
-->

<script>
  // /pdf 와 같은 표. 새 이름을 지으면 GA4 에서 같은 채널이 두 종류로 갈린다.
  // line = LINE 공식계정(인사말·리치메뉴·정기배신) — 2탄의 주 유입구.
  var ENTRY = {
    line:  ['line', 'official_account'],

  };

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XBCFC6FWB6', hit ? {
