<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無料資料室 — Hikaro</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://hikaro-world.com/">
<!--
  무료 자료실 — LINE 인사말·리치메뉴가 가리키는 단 하나의 주소.

  왜 자료마다 LINE 을 고치지 않고 여기로 모으는가:
    자료가 늘 때마다 인사말·리치메뉴 이미지·DM 문구를 다 고치면, 한 군데만 빠져도
    "받으러 왔는데 없다"가 생긴다. 여기에 카드 한 장 추가하는 것으로 끝나게 한다.

  🔴 새 자료 추가 = <a class="card"> 블록 하나를 **맨 위에** 복사.
     data-asset 은 GA4 자산 이름(기존 /pdf 계열과 같은 값을 쓴다 — 총합이 안 깨지게).
     NEW 뱃지는 최신 한 장에만 둔다.

  🔴 유입구는 ?s= 로 받는다 (/pdf 계열과 같은 ENTRY 표). 예: /free?s=line
     카드는 PDF 로 직행한다 — /pdf 착지를 거치면 click_lead_magnet 이 두 번 찍힌다.
-->
<style>
  @font-face{font-family:'RHR-JP';src:url('/fonts/ResourceHanRoundedJP-Bold.ttf');font-weight:700;font-display:swap}
  @font-face{font-family:'RHR-JP';src:url('/fonts/ResourceHanRoundedJP-Regular.ttf');font-weight:400;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FAFAF8;color:#1A1A1A;font-family:'RHR-JP',system-ui,sans-serif;
       padding:36px 20px 48px;max-width:480px;margin:0 auto}
  .brand{font-family:system-ui,sans-serif;font-weight:800;color:#007050;letter-spacing:.5px;font-size:18px}
  .eyebrow{font-size:13px;color:#007050;letter-spacing:2px;font-weight:700;margin-top:28px}
  h1{font-size:23px;line-height:1.5;font-weight:700;margin-top:8px}
  .lead{font-size:14px;color:#5C7066;margin-top:8px}
  .list{display:flex;flex-direction:column;gap:14px;margin-top:26px}
  .card{display:flex;gap:16px;align-items:center;padding:14px;background:#fff;border-radius:18px;
        text-decoration:none;color:inherit;border:1px solid rgba(0,0,0,.06);
        box-shadow:0 4px 10px rgba(0,112,80,.08)}
  .card:active{transform:scale(.99)}
  .cover{width:92px;flex:none;aspect-ratio:4/5;border-radius:8px;overflow:hidden;
         border:1px solid rgba(0,0,0,.08);background:#FAFAF8}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .body{flex:1;min-width:0}
  .new{display:inline-block;font-size:11px;font-weight:700;color:#FAFAF8;background:#007050;
       border-radius:999px;padding:2px 10px;margin-bottom:6px;letter-spacing:1px}
  .t{font-size:17px;font-weight:700;line-height:1.35}
  .m{font-size:12px;color:#007050;font-weight:700;margin-top:4px}
  .d{font-size:13px;color:#5C7066;line-height:1.55;margin-top:6px}
  .go{flex:none;color:#007050;font-size:20px;font-weight:700}
  .foot{margin-top:30px;font-size:13px;color:#5C7066;line-height:1.8;text-align:center}
  .sign{margin-top:14px;font-size:13px;color:#9AB3A8;text-align:center}
  /* PC(LINE PC 앱은 기본 브라우저로 연다): 폭을 넓히고 카드를 세로형 3열로 */
  @media (min-width:760px){
    body{max-width:920px;padding:64px 40px}
    h1{font-size:30px}
    .list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
    .card{flex-direction:column;align-items:stretch;padding:18px;gap:14px}
    .cover{width:100%}
    .go{display:none}
    .card:hover{box-shadow:0 8px 20px rgba(0,112,80,.16);transform:translateY(-2px)}
    .card{transition:box-shadow .15s,transform .15s}
  }
</style>

<div class="brand">Hikaro</div>
<div class="eyebrow">無料資料室</div>
<h1>コメントでお約束した<br>資料は、ここにあります</h1>
<p class="lead">押すと、PDFが開きます。</p>

<div class="list">
  <a class="card" data-asset="parts_quickref" href="/lead/parts-quickref.pdf">
    <div class="cover"><img src="covers/parts-quickref-01.jpg" alt=""></div>
    <div class="body">
      <span class="new">NEW</span>
      <div class="t">パーツ早見表</div>
      <div class="m">56パーツ・全11ページ</div>
      <div class="d">同じパーツの漢字は、韓国語でも同じ音で読めます。</div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="card" data-asset="onyomi_henkan" href="/lead/onyomi-henkan.pdf">
    <div class="cover"><img src="covers/onyomi-henkan-01.jpg" alt=""></div>
    <div class="body">
      <div class="t">音読み変換表</div>
      <div class="m">6つのルール・全13ページ</div>
      <div class="d">音読みの「形」から、ハングルが予測できます。</div>
    </div>
    <div class="go">›</div>
  </a>

  <a class="card" data-asset="pareto30" href="/lead/pareto30.pdf">
    <div class="cover"><img src="covers/pareto30-01.jpg" alt=""></div>
    <div class="body">
      <div class="t">毎日使う単語30</div>
      <div class="m">例文つき・全12ページ</div>
      <div class="d">韓国人が毎日いちばん使う動詞・形容詞。</div>
    </div>
    <div class="go">›</div>
  </a>
</div>

<p class="foot">新しい資料は、ここに追加していきます。<br>LINEの下のメニューから、いつでも見返せます。</p>
<p class="sign">ー Hikaro / フユ</p>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-XBCFC6FWB6"></script>
<script>
  // /pdf 계열과 같은 표. 새 이름을 지으면 GA4 에서 같은 채널이 두 종류로 갈린다.
  var ENTRY = {
    line:  ['line', 'official_account'],
    bc:    ['line', 'broadcast'],
    story: ['instagram', 'story'],
    bio:   ['instagram', 'bio'],
    feed:  ['instagram', 'feed'],
    dm:    ['instagram', 'dm'],
    note:  ['note', 'article'],
    yt:    ['youtube', 'video'],
    th:    ['threads', 'post'],
    threads: ['threads', 'post']
  };
  var code = new URLSearchParams(location.search).get('s');
  var hit = Object.prototype.hasOwnProperty.call(ENTRY, code) ? ENTRY[code] : null;

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XBCFC6FWB6', hit ? {
    campaign_source: hit[0], campaign_medium: hit[1], campaign_name: 'free_library'
  } : {});

  // 이벤트명은 /pdf 착지와 같게 — "리드마그넷 총합"이 안 깨진다. via 로 자료실 경유를 가른다.
  document.querySelectorAll('.card').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var go = function () { location.href = a.href; };
      var t = setTimeout(go, 700);
      gtag('event', 'click_lead_magnet', {
        asset: a.dataset.asset, entry: hit ? code : 'unknown', via: 'library',
        transport_type: 'beacon', event_callback: function () { clearTimeout(t); go(); }
      });
    });
  });
</script>
</html>
